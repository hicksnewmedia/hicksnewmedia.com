<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>HicksNewMedia Merch</title>
  <!-- Old product address. Product pages now live in index.html; this forwards any old link. -->
  <script>
    (function () {
      var sp = new URLSearchParams(location.search);
      var m = location.pathname.match(/\/products\/([^\/?#]+)/);
      var slug = m ? decodeURIComponent(m[1]) : (sp.get('slug') || sp.get('product') || '');
      var home = /^merch\./.test(location.hostname) ? '/' : location.pathname.replace(/[^\/]*$/, '');
      location.replace(home + (slug ? '?product=' + encodeURIComponent(slug) : ''));
    })();
  </script>
</head>
<body>
  <p><a href="https://merch.hicksnewmedia.com/">Go to the HicksNewMedia store</a></p>
</body>
</html>
